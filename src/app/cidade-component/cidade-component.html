<div class="container">

  <div class="display-4 text-center">Cadastro de Cidades</div>

  <form [formGroup]="formGroupCidade">
   <div class="mb-3">
      <label for="inputName" class="form-label">Nome</label>
      <input formControlName="nome" type="text" class="form-control" id="inputName">
    </div>

    <div class="mb-3">
      <label for="inputDescription" class="form-label">Estado</label>
      <input formControlName="estado" type="text" class="form-control" id="inputDescription">
    </div>

    <div class="mb-3">
      <label for="inputPrice" class="form-label">População</label>
      <input formControlName="populacao" type="text" class="form-control" id="inputPrice">
    </div>

    <div class="mb-3">
      <label for="inputPrice" class="form-label">É capital?</label>
      <input formControlName="capital" type="text" class="form-control" id="inputPrice" cl>
    </div>

    <button type="submit" class="btn btn-primary" (click)="save()">Salvar</button>
  </form>
  <br>
  total de cidades {{Cidades.length}}
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      @for (cidade of Cidades; track cidade.id) {
        <div class="col">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <h3 class="card-title h5 mb-0">{{ cidade.nome }}</h3>
                <span class="badge text-bg-primary">{{ cidade.estado }}</span>
              </div>
              <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between px-0">
                  <span class="text-body-secondary">População</span>
                  <strong>{{ cidade.populacao }}</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between px-0">
                  <span class="text-body-secondary">Capital:</span>
                  <strong>{{ cidade.capital }}</strong>
                </li>
              </ul>
            </div>
            <div class="card-footer bg-transparent small text-body-secondary">
              id: {{ Cidades.length }}
            </div>
          </div>
        </div>
      }
  </div>

</div>
